{% extends "base.html" %}
{% block title %}New Kettle{% endblock %}
{% block content %}
<h1>Start a new kettle</h1>
<section class="panel">
  <form method="post" class="form" id="kettle-form">
    <label>Kettle name<input type="text" name="name" required placeholder="e.g. Brooklyn Apartment, Cabo Trip"></label>

    <div class="type-toggle">
      <label class="type-option">
        <input type="radio" name="type" value="household" checked onchange="toggleType()">
        <div><strong>Household</strong><small>Rent, utilities, groceries — split evenly among current members</small></div>
      </label>
      <label class="type-option">
        <input type="radio" name="type" value="trip" onchange="toggleType()">
        <div><strong>Trip</strong><small>One shared pool, prorated per day — late joiners only owe from their join date</small></div>
      </label>
    </div>

    <div id="household-fields">
      <div class="two-col">
        <label>Monthly rent<input type="number" step="0.01" min="0" name="rent" placeholder="0.00"></label>
        <label>Monthly utilities<input type="number" step="0.01" min="0" name="utilities" placeholder="0.00"></label>
      </div>
      <label>Monthly groceries<input type="number" step="0.01" min="0" name="groceries" placeholder="0.00"></label>
    </div>

    <div id="trip-fields" style="display:none">
      <div class="two-col">
        <label>Start date<input type="date" name="start_date"></label>
        <label>End date<input type="date" name="end_date"></label>
      </div>
      <label>Total trip pool (QR)<input type="number" step="0.01" min="0" name="total_amount" placeholder="0.00"></label>
    </div>

    <button class="btn btn-primary btn-lg full" type="submit">Create kettle</button>
  </form>
</section>

<script>
function toggleType() {
  var isTrip = document.querySelector('input[name=type]:checked').value === 'trip';
  document.getElementById('household-fields').style.display = isTrip ? 'none' : 'block';
  document.getElementById('trip-fields').style.display = isTrip ? 'block' : 'none';
}
</script>
{% endblock %}
